[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proof-fabric"
version = "0.1.0"
description = "Portable proof-carrying artifact fabric — re-verify on every read"
requires-python = ">=3.12"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pcf = "proof_fabric.cli:main"
